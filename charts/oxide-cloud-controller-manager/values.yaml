replicaCount: 1

# Run on the host network, as a CCM must when it starts before the cluster's CNI.
hostNetwork: true

rbac:
  create: true

# A Secret holding a kubeconfig (key `value`) for the cluster to manage, when the CCM runs
# outside it.
kubeconfig:
  secretName: ""

# The Secret with oxide-host, oxide-token and oxide-project. Defaults to the release's name.
credentialsSecret: ""

additionalLabels: {}

image:
  repository: ghcr.io/oxidecomputer/oxide-cloud-controller-manager
  pullPolicy: IfNotPresent
  # Uses Chart.yaml's `appVersion` when empty.
  tag: ""

resources:
  requests:
    cpu: 100m
    memory: 50Mi

nodeSelector: {}

tolerations:
  - key: "node.cloudprovider.kubernetes.io/uninitialized"
    value: "true"
    effect: NoSchedule
  - key: "node-role.kubernetes.io/control-plane"
    effect: NoSchedule
  - key: "node-role.kubernetes.io/etcd"
    operator: Exists
    effect: NoExecute
  - key: "node.kubernetes.io/not-ready"
    operator: Exists
    effect: NoSchedule
  - key: CriticalAddonsOnly
    operator: Exists

affinity: {}

extraArgs: []
